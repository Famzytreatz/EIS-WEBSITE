<!DOCTYPE html>
<html lang="en">
<head>
     <style>
      body{
            background-image:url("inquiry-bg.png");
      height: 100vh;
      background-size: cover;
            
      }
     </style>
  <meta charset="UTF-8">
    <title>Student Registration | Eliud International School</title>
      <link rel="stylesheet" href="style.css">
      </head>
      


                                                                                
      <body>
            <video autoplay muted loop playsinline id="bg-video">
                    <source src="background.mp4" type="video/mp4">
                      Your browser does not support the video tag.
                      </video>
                      
            

                    

        <header class="page-header"> 
            <a href="index.html">Back to Home</a>

            <div class="header">
                    <img src="logo.png" alt="School Logo" class="logo">
                      <h1>STUDENT REGISTRATION</h1>
            </div>
                <p>ELIUD INTERNATIONAL SCHOOL</p>
            
                  </header>

                    <section class="registration">
            
                          <form id="regForm" action="https://formsubmit.co/eliudinternationalschool1@gmail.com" method="POST">
                                <!-- form fields -->
                                  <button type="submit">Submit</button>
                                  

                                  <script>
                                  document.getElementById('regForm').addEventListener('submit', async function(e) {
                                    e.preventDefault();
                                      const form = e.target;
                                        const data = new FormData(form);

                                          try {
                                              const resp = await fetch(form.action, {
                                                    method: 'POST',
                                                          body: data,
                                                                // FormSubmit may reject fetch due to CORS; this is mainly for your own endpoints.
                                                                    });

                                                                        if (resp.ok) {
                                                                              // redirect on success
                                                                                    window.location.href = '/success.html'; // or full URL
                                                                                        } else {
                                                                                              alert('Submission failed. Please try again.');
                                                                                                  }
                                                                                                    } catch (err) {
                                                                                                        console.error(err);
                                                                                                            alert('Network error. Please try again.');
                                                                                                              }
                                                                                                              });
                                                                                                              </script>
                              <h2>Student Registration Form</h2>

                                    <label>Full Name</label>
                                          <input type="text" name="fullname" required>

                                                <label>Email Address</label>
                                                      <input type="email" name="email" required>

                                                            <label>Phone Number</label>
                                                                  <input type="tel" name="phone" required>

                                                                        <label>Gender</label>
                                                                              <select name="gender" required>
                                                                                      <option value="">Select</option>
                                                                                              <option>Male</option>
                                                                                                      <option>Female</option>
                                                                                                            </select>

                                                                                                                  <label>Class Applying For</label>
                                                                                                                        <select name="class" required>
                                                                                                                                <option value="">Select Class</option>
                                                                                                                                        <option>JSS 1</option>
                                                                                                                                                <option>JSS 2</option>
                                                                                                                                                        <option>JSS 3</option>
                                                                                                                                                                <option>SSS 1</option>
                                                                                                                                                                        <option>SSS 2</option>
                                                                                                                                                                                <option>SSS 3</option>
                                                                                                                                                                                      </select>

                                                                                                                                                                                            <label>Parent / Guardian Name</label>
                                                                                                                                                                                                  <input type="text" name="guardian" required>

                                                                                                                                                                                                        <label>Parent / Guardian Phone</label>
                                                                                                                                                                                                              <input type="tel" name="guardian_phone" required>

                                                                                                                                                                                                                    <label>Additional Message</label>
                                                                                                                                                                                                                          <textarea name="message" placeholder="Any extra information"></textarea>
                                                                                                                                                                                                                                                <button type="submit">Submit Registration</button> 
                                                                                                                                                                                                                                                <input type="hidden" name="_captcha" value="false">
                                                                                                                                                                                                                                                <input type="hidden" name="_next" value="success.html">
                                                                                                                                                                                                                                                <input type="hidden" name="_subject" value="New Student Registration">
                                                                                                                                                                                                                                                

                                                                                                                                                                                                                                    </form>

                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                        <footer class="page-footer">
                                                                                                                                                                                                                                            <p>© 2025/2026 Eliud International School</p>
                                                                                                                                                                                                                                               </footer>

                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                              </html>
